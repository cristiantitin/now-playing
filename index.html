<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Now Playing">
<meta name="theme-color" content="#000000">
<title>Now Playing</title>
<style>
  :root { --art: min(86vw, 86vh); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; }

  /* ---------- Base (vista Centro) ---------- */
  .slide { position: fixed; inset: 0; opacity: 0; transition: opacity 1.2s ease; overflow: hidden; }
  .slide.on { opacity: 1; }
  .bg { position: absolute; inset: -12%; background-size: cover; background-position: center;
    filter: blur(60px) saturate(1.4) brightness(0.55); transform: scale(1.1); }
  .art { position: absolute; top: 50%; left: calc(50vw - var(--art) / 2); width: var(--art); height: var(--art);
    transform: translateY(-50%); object-fit: cover; border-radius: 6px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    transition: opacity .8s, filter .8s, top .6s, left .6s, width .6s, height .6s; }
  .art[src=""] { display: none; }

  body.info { --art: min(80vw, 70vh); }
  body.info .art { top: 44%; }

  #info { position: fixed; left: 6vw; right: 6vw; bottom: 5vh; text-align: center;
    opacity: 0; transition: opacity .6s; pointer-events: none; text-shadow: 0 2px 16px rgba(0,0,0,.45); }
  body.info #info { opacity: 1; }
  #track { font-size: clamp(18px, 3.2vh, 34px); font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  #artist { font-size: clamp(14px, 2.4vh, 24px); opacity: .75; margin-top: .3em; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  #album { display: none; }

  #clock { position: fixed; top: max(20px, env(safe-area-inset-top)); right: 24px; left: auto;
    font-size: clamp(18px, 2.8vh, 30px); font-weight: 800; opacity: 0; transition: all .8s;
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
    text-shadow: 0 2px 12px rgba(0,0,0,.5); pointer-events: none; }
  body.clock #clock { opacity: .9; }

  /* ---------- Vista Gigante: portada a toda pantalla que se desplaza ---------- */
  body.mode-giant .bg { display: none; }
  body.mode-giant .art { top: 0; left: 0; width: 130vmax; height: 130vmax; border-radius: 0;
    box-shadow: none; transform: none; animation: pan 100s ease-in-out infinite; }
  @keyframes pan {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(calc(100vw - 130vmax), 0); }
    50% { transform: translate(calc(100vw - 130vmax), calc(100vh - 130vmax)); }
    75% { transform: translate(0, calc(100vh - 130vmax)); }
  }
  body.mode-giant #info { left: 5vw; right: 5vw; text-align: left; text-shadow: 0 2px 20px rgba(0,0,0,.8); }

  /* ---------- Vistas Izquierda / Derecha ---------- */
  body.mode-left .art, body.mode-right .art { --art: min(56vw, 84vh); top: 50%; transform: translateY(-50%); }
  body.mode-left .art { left: 5vw; }
  body.mode-right .art { left: calc(95vw - var(--art)); }

  body.mode-left #info, body.mode-right #info { opacity: 1; top: 50%; bottom: auto; transform: translateY(-50%); }
  body.mode-left #info { left: calc(9vw + min(56vw, 84vh)); right: 5vw; text-align: left; }
  body.mode-right #info { left: 5vw; right: calc(9vw + min(56vw, 84vh)); text-align: right; }
  body.mode-left #track, body.mode-right #track { white-space: normal; font-size: clamp(22px, 4.8vh, 54px);
    line-height: 1.12; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  body.mode-left #artist, body.mode-right #artist { white-space: normal; font-size: clamp(16px, 3vh, 32px); margin-top: .5em; }
  body.mode-left #album, body.mode-right #album { display: block; font-size: clamp(13px, 2.2vh, 22px);
    opacity: .55; margin-top: 1.4em; }
  body.mode-right #clock { right: auto; left: 24px; }

  /* En vertical, Izquierda/Derecha se apilan para que quepan */
  @media (orientation: portrait) {
    body.mode-left .art, body.mode-right .art { --art: min(84vw, 60vh); left: calc(50vw - var(--art) / 2); top: 40%; }
    body.mode-left #info, body.mode-right #info { top: auto; bottom: 6vh; transform: none; left: 6vw; right: 6vw; text-align: center; }
  }

  /* ---------- Pausa: reloj grande ---------- */
  body.idle .art { opacity: .3; filter: grayscale(.5); }
  body.idle #clock { opacity: 1; top: 50%; left: 50%; right: auto; transform: translate(-50%, -50%);
    font-size: clamp(64px, 19vh, 230px); font-weight: 700; letter-spacing: -0.02em; }
  body.idle #info { opacity: 0; }

  /* ---------- Menú ---------- */
  #menu { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; opacity: 0;
    pointer-events: none; transition: all .3s; z-index: 5; width: max-content; max-width: 92vw; }
  #menu.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  button { font: inherit; font-size: 15px; color: #fff; background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 10px 16px;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); cursor: pointer; }
  button.primary { background: #1ed760; color: #000; border: none; font-weight: 700; }

  /* ---------- Configuración ---------- */
  #setup { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 24px; background: #0b0b0b; z-index: 10; -webkit-user-select: text; user-select: text; }
  #setup.show { display: flex; }
  .card { width: 100%; max-width: 480px; }
  .card h1 { font-size: 26px; margin: 0 0 8px; }
  .card p { opacity: .7; line-height: 1.45; margin: 0 0 18px; font-size: 15px; }
  label { display: block; font-size: 13px; opacity: .6; margin: 14px 0 6px; }
  input, .uri { width: 100%; font: inherit; font-size: 15px; color: #fff; background: #1a1a1a;
    border: 1px solid #333; border-radius: 10px; padding: 12px; }
  .uri { word-break: break-all; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  #err { color: #ff6b6b; font-size: 14px; margin-top: 14px; min-height: 1em; }
</style>
</head>
<body>
  <div class="slide on" id="s0"><div class="bg"></div><img class="art" src="" alt=""></div>
  <div class="slide" id="s1"><div class="bg"></div><img class="art" src="" alt=""></div>

  <div id="info"><div id="track"></div><div id="artist"></div><div id="album"></div></div>
  <div id="clock"></div>

  <div id="menu">
    <button id="bMode">Vista</button>
    <button id="bInfo">Info</button>
    <button id="bClock">Reloj</button>
    <button id="bFull">Pantalla completa</button>
    <button id="bOut">Desconectar</button>
  </div>

  <div id="setup">
    <div class="card">
      <h1>Now Playing</h1>
      <p>Muestra la carátula de lo que suena en tu Spotify. Pega el Client ID de tu app de Spotify y registra en ella la Redirect URI de abajo, exactamente igual.</p>
      <label>Client ID</label>
      <input id="cid" placeholder="ej. 3f9a1c...">
      <label>Redirect URI (cópiala en el dashboard de Spotify)</label>
      <div class="uri" id="uri"></div>
      <div class="row">
        <button id="bCopy">Copiar URI</button>
        <button class="primary" id="bLogin">Conectar con Spotify</button>
      </div>
      <div id="err"></div>
    </div>
  </div>

<script>
(function () {
  var SCOPES = 'user-read-currently-playing user-read-playback-state';
  var REDIRECT = location.origin + location.pathname;
  var POLL_MS = 4000;
  var MODES = ['center', 'giant', 'left', 'right'];
  var MODE_NAMES = { center: 'Centro', giant: 'Gigante', left: 'Izquierda', right: 'Derecha' };

  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem('np_' + k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem('np_' + k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem('np_' + k); } catch (e) {} }
  };

  // ---------- Ajustes de vista ----------
  function currentMode() {
    var m = store.get('mode');
    return MODES.indexOf(m) >= 0 ? m : 'center';
  }
  function applyPrefs() {
    var b = document.body;
    b.classList.toggle('info', store.get('info') !== '0');
    b.classList.toggle('clock', store.get('clock') === '1');
    MODES.forEach(function (m) { b.classList.remove('mode-' + m); });
    var mode = currentMode();
    b.classList.add('mode-' + mode);
    $('bMode').textContent = 'Vista: ' + MODE_NAMES[mode];
  }
  applyPrefs();

  // Abierta desde el ícono de inicio no hay barra ni botón X de Safari: el botón de pantalla completa sobra
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (standalone) $('bFull').style.display = 'none';

  // ---------- Auth (PKCE, sin servidor) ----------
  function rand(n) {
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    var a = new Uint8Array(n); crypto.getRandomValues(a);
    var s = ''; for (var i = 0; i < n; i++) s += chars[a[i] % chars.length]; return s;
  }
  function b64url(buf) {
    var b = new Uint8Array(buf), s = '';
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  async function login() {
    var cid = $('cid').value.trim();
    if (!cid) { $('err').textContent = 'Falta el Client ID.'; return; }
    store.set('cid', cid);
    var verifier = rand(64);
    store.set('verifier', verifier);
    var digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    var p = new URLSearchParams({
      client_id: cid, response_type: 'code', redirect_uri: REDIRECT,
      code_challenge_method: 'S256', code_challenge: b64url(digest), scope: SCOPES
    });
    location.href = 'https://accounts.spotify.com/authorize?' + p.toString();
  }
  async function tokenRequest(body) {
    var r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(body)
    });
    var j = await r.json();
    if (!r.ok) throw new Error(j.error_description || j.error || 'Error de token');
    store.set('access', j.access_token);
    store.set('expires', String(Date.now() + (j.expires_in - 60) * 1000));
    if (j.refresh_token) store.set('refresh', j.refresh_token);
  }
  async function handleCallback() {
    var q = new URLSearchParams(location.search);
    if (q.get('error')) { history.replaceState(null, '', REDIRECT); throw new Error('Spotify: ' + q.get('error')); }
    var code = q.get('code');
    if (!code) return;
    history.replaceState(null, '', REDIRECT);
    await tokenRequest({
      grant_type: 'authorization_code', code: code, redirect_uri: REDIRECT,
      client_id: store.get('cid'), code_verifier: store.get('verifier')
    });
    store.del('verifier');
  }
  async function refresh() {
    await tokenRequest({ grant_type: 'refresh_token', refresh_token: store.get('refresh'), client_id: store.get('cid') });
  }
  async function token() {
    if (!store.get('access') || Date.now() > Number(store.get('expires') || 0)) await refresh();
    return store.get('access');
  }
  function logout() {
    ['access', 'refresh', 'expires'].forEach(store.del);
    showSetup();
  }

  // ---------- Pantalla ----------
  var current = '', slot = 0;
  function showArt(url) {
    if (!url || url === current) return;
    current = url;
    var img = new Image();
    img.onload = function () {
      slot = 1 - slot;
      var s = $('s' + slot);
      s.querySelector('.bg').style.backgroundImage = 'url("' + url + '")';
      s.querySelector('.art').src = url;
      s.classList.add('on');
      $('s' + (1 - slot)).classList.remove('on');
    };
    img.src = url;
  }
  function setIdle(idle) { document.body.classList.toggle('idle', idle); }

  async function poll() {
    var wait = POLL_MS;
    try {
      var t = await token();
      var r = await fetch('https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode', {
        headers: { Authorization: 'Bearer ' + t }
      });
      if (r.status === 401) { store.set('expires', '0'); wait = 500; }
      else if (r.status === 429) { wait = (Number(r.headers.get('Retry-After')) || 10) * 1000; }
      else if (r.status === 204) { setIdle(true); }
      else if (r.ok) {
        var j = await r.json();
        var it = j.item;
        if (!it) { setIdle(true); }
        else {
          var imgs = (it.album && it.album.images) || it.images || [];
          if (imgs.length) showArt(imgs[0].url);
          $('track').textContent = it.name || '';
          $('artist').textContent = it.artists ? it.artists.map(function (a) { return a.name; }).join(', ')
            : (it.show ? it.show.name : '');
          var albumTxt = '';
          if (it.album) {
            var year = (it.album.release_date || '').slice(0, 4);
            albumTxt = it.album.name + (year ? ' · ' + year : '');
          } else if (it.show) { albumTxt = it.show.publisher || ''; }
          $('album').textContent = albumTxt;
          setIdle(!j.is_playing);
        }
      }
    } catch (e) {
      if (/refresh|invalid_grant|revoked/i.test(e.message)) { logout(); $('err').textContent = 'La sesión expiró, vuelve a conectar.'; return; }
      wait = 10000; // sin internet: reintenta
    }
    setTimeout(poll, wait);
  }

  function tick() {
    $('clock').textContent = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
  }
  setInterval(tick, 5000); tick();

  // Mantener la pantalla encendida
  var lock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', function () { lock = null; }); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) keepAwake(); });

  // Menú: aparece solo al tocar la pantalla y se esconde a los 5 segundos
  var menuTimer;
  function showMenu() {
    $('menu').classList.add('show');
    clearTimeout(menuTimer);
    menuTimer = setTimeout(function () { $('menu').classList.remove('show'); }, 5000);
  }
  document.addEventListener('click', function (e) {
    keepAwake();
    if ($('setup').classList.contains('show')) return;
    if (e.target.tagName === 'BUTTON') { showMenu(); return; }
    showMenu();
  });
  $('bMode').onclick = function () {
    var i = MODES.indexOf(currentMode());
    store.set('mode', MODES[(i + 1) % MODES.length]);
    applyPrefs();
  };
  $('bInfo').onclick = function () { store.set('info', store.get('info') === '0' ? '1' : '0'); applyPrefs(); };
  $('bClock').onclick = function () { store.set('clock', store.get('clock') === '1' ? '0' : '1'); applyPrefs(); };
  $('bFull').onclick = function () {
    var d = document.documentElement;
    (d.requestFullscreen || d.webkitRequestFullscreen || function () {}).call(d);
  };
  $('bOut').onclick = logout;

  // Setup
  function showSetup() {
    $('cid').value = store.get('cid') || '';
    $('uri').textContent = REDIRECT;
    $('setup').classList.add('show');
  }
  $('bLogin').onclick = login;
  $('bCopy').onclick = function () {
    try { navigator.clipboard.writeText(REDIRECT); $('bCopy').textContent = 'Copiada ✓'; } catch (e) {}
  };

  // Inicio
  (async function start() {
    try { await handleCallback(); } catch (e) { showSetup(); $('err').textContent = e.message; return; }
    if (!store.get('refresh') || !store.get('cid')) { showSetup(); return; }
    $('setup').classList.remove('show');
    keepAwake();
    poll();
  })();
})();
</script>
</body>
</html>
